<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly Digital Marketing Agency</title>
  <meta name="description" content="The page or campaign resource you are looking for could not be found. Return to Stackly Digital Marketing Agency homepage.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; background: radial-gradient(circle at 50% 30%, rgba(255, 107, 0, 0.22) 0%, rgba(12, 10, 9, 0.98) 70%), url('downloaded_images/digital-marketing.webp') center/cover no-repeat fixed; text-align: center; position: relative;">

  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <!-- 404 FULLSCREEN CONTENT CARD -->
  <div style="position: relative; z-index: 2; max-width: 720px; width: 100%; background: var(--bg-surface-elevated); border: 1px solid var(--border-active); border-radius: var(--radius-lg); padding: 3.5rem 2.5rem; box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 40px rgba(255, 107, 0, 0.2);">
    
    <div class="sec-eyebrow" style="margin-bottom: 0.75rem;">
      <i class="fa-solid fa-triangle-exclamation"></i> 404 Telemetry Error
    </div>

    <h1 style="font-family: var(--font-heading); font-size: clamp(5rem, 12vw, 8rem); font-weight: 900; line-height: 0.9; margin-bottom: 1rem; background: var(--grad-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 30px rgba(255, 107, 0, 0.45));">
      404
    </h1>

    <h2 style="font-family: var(--font-heading); font-size: 1.85rem; font-weight: 800; color: #fff; margin-bottom: 1rem;">
      Resource or Page Not Found
    </h2>

    <p style="font-size: 1.05rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 2.25rem; max-width: 540px; margin-left: auto; margin-right: auto;">
      The requested telemetry resource or campaign link could not be traced. Please use the actions below to navigate back to safety.
    </p>

    <!-- REQUIRED ACTION BUTTONS: GO BACK AND BACK TO HOME -->
    <div style="display: flex; gap: 1.25rem; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 1rem;">
      
      <!-- GO BACK BUTTON -->
      <button type="button" onclick="window.history.back();" class="btn-glow-gold" style="width: auto !important; min-width: 200px; padding: 0.9rem 2.2rem; font-size: 1.05rem; font-weight: 800; color: #000; cursor: pointer; border-radius: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; box-shadow: 0 0 25px rgba(255, 107, 0, 0.65);">
        <i class="fa-solid fa-arrow-left" style="font-size: 1.15rem; color: #000;"></i> Go Back
      </button>

      <!-- BACK TO HOME BUTTON -->
      <a href="index.html" class="hbtn-ghost" style="width: auto !important; min-width: 200px; padding: 0.9rem 2.2rem; font-size: 1.05rem; font-weight: 800; color: #ffffff; background: rgba(255, 255, 255, 0.08); border: 2px solid #ffcc00; border-radius: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; box-shadow: 0 0 20px rgba(255, 204, 0, 0.25); text-decoration: none;">
        <i class="fa-solid fa-house" style="font-size: 1.1rem; color: #ffcc00;"></i> Back to Home
      </a>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
