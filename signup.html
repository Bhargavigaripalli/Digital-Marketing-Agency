<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Stackly Growth Portal</title>
  <meta name="description" content="Register your brand or agency account to access live performance metrics and campaign dashboards.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

  <div class="auth-overlay"></div>

  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <div class="auth-card" style="max-width:540px;">
    <div class="auth-logo" style="display:flex; justify-content:center; align-items:center; text-align:center; margin-bottom:1.5rem; width:100%;">
      <a href="index.html" style="display:inline-flex; justify-content:center; align-items:center;">
        <img src="logo_gold.webp" alt="Stackly Logo" style="display:block; margin:0 auto;">
      </a>
    </div>

    <div class="auth-header" style="text-align:center; margin-bottom:1.5rem;">
      <h2>Create Terminal Account</h2>
      <p>Start tracking campaign ROAS, lead velocity, and live telemetry</p>
    </div>

    <!-- DUAL ROLE TOGGLE SWITCH FOR ACCOUNT REGISTRATION -->
    <div class="role-toggle-container">
      <button type="button" class="role-toggle-btn active" id="regUserRole" onclick="setRegRole('user')">
        <i class="fa-solid fa-user"></i> User Account
      </button>
      <button type="button" class="role-toggle-btn" id="regAdminRole" onclick="setRegRole('admin')">
        <i class="fa-solid fa-shield-halved"></i> Admin Request
      </button>
    </div>

    <form id="signupForm" onsubmit="handleSignup(event)">
      <div class="form-row-2col">
        <div class="form-group">
          <label for="fullname">Full Name *</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="fullname" placeholder="SarahJenkins" required pattern="[A-Za-z]{1,16}" maxlength="16" oninput="this.value = this.value.replace(/[^A-Za-z]/g, '').slice(0, 16);" title="Please enter alphabets only without spaces (up to 16 characters)">
          </div>
        </div>

        <div class="form-group">
          <label for="company">Company / Brand *</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-building"></i>
            <input type="text" id="company" placeholder="Acme Global" required pattern="[A-Za-z\s]{1,20}" maxlength="20" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '').slice(0, 20);" title="Please enter alphabets only (up to 20 characters)">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Work Email Address *</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="sarah@company.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="role">Primary Account Role</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-briefcase"></i>
          <select id="role" required>
            <option>CMO / Marketing Director</option>
            <option>Founder / CEO</option>
            <option>Growth Lead / Media Buyer</option>
            <option>E-Commerce Brand Director</option>
          </select>
        </div>
      </div>

      <div class="form-row-2col">
        <div class="form-group">
          <label for="password">Create Password *</label>
          <div class="input-with-icon" style="position:relative;">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="••••••••••••" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z0-9]).{8,}" style="padding-right:2.8rem;">
            <i class="fa-solid fa-eye toggle-pass-eye" id="togglePass" onclick="togglePassVis('password', 'togglePass')" style="position:absolute; left:auto; right:1.1rem; top:50%; transform:translateY(-50%); cursor:pointer; color:#ffcc00; font-size:1.05rem; z-index:10;"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <div class="input-with-icon" style="position:relative;">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="••••••••••••" required minlength="8" style="padding-right:2.8rem;">
            <i class="fa-solid fa-eye toggle-pass-eye" id="toggleConfirmPass" onclick="togglePassVis('confirmPassword', 'toggleConfirmPass')" style="position:absolute; left:auto; right:1.1rem; top:50%; transform:translateY(-50%); cursor:pointer; color:#ffcc00; font-size:1.05rem; z-index:10;"></i>
          </div>
        </div>
      </div>

      <div class="help-text-code" style="margin-bottom: 0.75rem;">
        Min 8 chars: 1 Uppercase, 1 Lowercase, 1 Number & 1 Special char
      </div>
      <div id="signupPassError" style="display:none; color:#ff4d4d; font-size:0.8rem; margin-bottom:0.75rem; font-weight:600;"></div>

      <div class="form-options" style="margin-bottom: 1.5rem;">
        <label style="color:var(--text-muted); font-size:0.85rem; cursor:pointer;">
          <input type="checkbox" id="agreeTerms" required style="accent-color:var(--accent-cyan);"> I agree to <a href="404.html" style="color:var(--accent-cyan); font-weight:600;">Terms & Privacy *</a>
        </label>
      </div>

      <button type="submit" class="btn-glow-gold" id="btnRegSubmit" style="width:100%; justify-content:center; padding:1.05rem; font-size:1.05rem; font-weight:800; color:#000000; background:linear-gradient(135deg, #ff6b00 0%, #ffcc00 100%);">
        Register & Enter Dashboard <i class="fa-solid fa-user-plus"></i>
      </button>

    </form>

    <div style="text-align:center; margin-top:1.75rem; font-size:0.88rem; color:var(--text-muted);">
      Already have an account? <a href="login.html" style="color:var(--accent-cyan); font-weight:700;">Sign In</a>
    </div>

    <div style="text-align:center; margin-top:1rem; font-size:0.82rem;">
      <a href="index.html" style="color:var(--text-muted); text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='var(--accent-cyan)';" onmouseout="this.style.color='var(--text-muted)';">
        <i class="fa-solid fa-arrow-left"></i> Return to Homepage
      </a>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    let currentRegRole = 'user';

    function setRegRole(role) {
      currentRegRole = role;
      const btnUser = document.getElementById('regUserRole');
      const btnAdmin = document.getElementById('regAdminRole');
      const btnSubmit = document.getElementById('btnRegSubmit');

      if (role === 'user') {
        btnUser.classList.add('active');
        btnAdmin.classList.remove('active');
        btnSubmit.innerHTML = 'Register & Enter Dashboard <i class="fa-solid fa-user-plus"></i>';
      } else {
        btnAdmin.classList.add('active');
        btnUser.classList.remove('active');
        btnSubmit.innerHTML = 'Request Admin Provisioning <i class="fa-solid fa-shield-halved"></i>';
      }
    }

    function togglePassVis(inputId, iconId) {
      const passInput = document.getElementById(inputId);
      const toggleIcon = document.getElementById(iconId);
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passInput.type = 'password';
        toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      const errorDiv = document.getElementById('signupPassError');
      const strongRegex = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^a-zA-Z0-9])(?=.{8,})");

      if (!agreeTerms) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'You must agree to the Terms & Privacy to create an account.';
        return false;
      }

      if (!strongRegex.test(pass)) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Weak password! Must be at least 8 chars with 1 uppercase, 1 lowercase, 1 number & 1 special char.';
        return false;
      }

      if (pass !== confirmPass) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Passwords do not match. Please ensure Create Password and Confirm Password are identical.';
        return false;
      }

      errorDiv.style.display = 'none';
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
